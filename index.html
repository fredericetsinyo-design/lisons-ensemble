<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lisons Ensemble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B211C">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Lisez, annotez et écoutez vos livres avec votre groupe de lecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: phone = green header band + cover grid + bottom tab bar; desktop = navy frame with icon sidebar around a white dashboard card. Reader = full-screen overlay with notes column and audio bar. */
:root{
  --bg:#F6F0E6; --surface:#FFFFFF; --surface-2:#FBF6EE; --ink:#2A1F1A; --ink-2:#6E625A; --line:#E9DDCC;
  --green:#C4552B; --green-2:#A9461F; --on-green:#FFFFFF; --green-soft:#F8E1D4;
  --navy:#2B211C; --on-navy:#FFFFFF; --navy-2:#3B2E27; --frame:#2B211C;
  --sand:#F3E4CB; --sand-ink:#6B4A1E;
  --mint:#F2C14E; --mint-ink:#2A1F1A;
  --peach:#DDE8F4; --peach-ink:#24476E; --orange:#E0A32A;
  --hl-y:#FBE38A; --hl-g:#BCE4C5; --hl-b:#C6D9F6; --hl-r:#F6C9D4;
  --paper:#FFFFFF; --paper-ink:#2A1F1A; --speak:#FFE7A0;
  --danger:#B3402E; --scrim:rgba(20,14,10,.5);
  --shadow:0 12px 32px rgba(42,31,26,.14);
  /* Colours picked from the photos: rust sweaters, mustard armchair, denim shirts, teal sleeve, library wood. Same in both themes because they sit on photos. */
  --rust:#C4552B; --mustard:#E3A82B; --denim:#3E6A9A; --teal:#1F7A72; --espresso:#2A1F1A; --on-photo:#FFFFFF;
  --shade:rgba(30,20,15,.88); --shade-mid:rgba(30,20,15,.5); --shade-0:rgba(30,20,15,0);
  --cv1:#C4552B; --cv2:#3E6A9A; --cv3:#1F7A72; --cv4:#B7841A; --cv5:#2B211C; --cv6:#A8322E;
  --f-ui:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#221A16; --surface-2:#2A211C; --ink:#F3EAE0; --ink-2:#BBAEA2; --line:#3A2F28;
  --green:#E27C4C; --green-2:#CF6838; --on-green:#1A0F0A; --green-soft:#4A2A1D;
  --navy:#2E2420; --on-navy:#FFFFFF; --navy-2:#3E312A; --frame:#0F0B09;
  --sand:#3B3022; --sand-ink:#EBD9B8;
  --mint:#E3B23C; --mint-ink:#2A1F1A;
  --peach:#1F3045; --peach-ink:#CFE0F3; --orange:#E8B040;
  --hl-y:rgba(240,200,60,.38); --hl-g:rgba(90,190,120,.35); --hl-b:rgba(110,150,230,.38); --hl-r:rgba(230,110,140,.36);
  --paper:#1B1512; --paper-ink:#EDE4DA; --speak:rgba(255,215,90,.30);
  --danger:#F08B78; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#221A16; --surface-2:#2A211C; --ink:#F3EAE0; --ink-2:#BBAEA2; --line:#3A2F28;
  --green:#E27C4C; --green-2:#CF6838; --on-green:#1A0F0A; --green-soft:#4A2A1D;
  --navy:#2E2420; --on-navy:#FFFFFF; --navy-2:#3E312A; --frame:#0F0B09;
  --sand:#3B3022; --sand-ink:#EBD9B8;
  --mint:#E3B23C; --mint-ink:#2A1F1A;
  --peach:#1F3045; --peach-ink:#CFE0F3; --orange:#E8B040;
  --hl-y:rgba(240,200,60,.38); --hl-g:rgba(90,190,120,.35); --hl-b:rgba(110,150,230,.38); --hl-r:rgba(230,110,140,.36);
  --paper:#1B1512; --paper-ink:#EDE4DA; --speak:rgba(255,215,90,.30);
  --danger:#F08B78; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.side{display:none}
.topnav{display:none}
.main{min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-2);padding:6px 0;border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--green);font-weight:600}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

@media (min-width:960px){
  body{background:var(--frame)}
  .shell{display:grid;grid-template-columns:104px minmax(0,1fr);padding:0;min-height:100%;
    padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:env(safe-area-inset-left,0px)}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:28px;color:var(--on-navy);position:sticky;top:0;height:100vh}
  .logo{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:40px;letter-spacing:.02em}
  .logo svg{width:34px;height:34px}
  .side nav{display:flex;flex-direction:column;gap:14px;flex:1}
  .side nav button{width:72px;border:0;background:none;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;border-radius:14px}
  .side nav button .dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
  .side nav button[aria-current="page"]{color:#fff;font-weight:600}
  .side nav button[aria-current="page"] .dot{background:var(--mustard);color:var(--espresso)}
  .side nav button:hover .dot{background:rgba(255,255,255,.12)}
  .side nav button[aria-current="page"]:hover .dot{background:var(--mustard)}
  .main{background:var(--bg);border-radius:30px;margin-block:20px;min-height:calc(100vh - 40px);overflow:hidden}
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 36px 0}
  .topnav .links{display:flex;gap:28px}
  .topnav .links button{border:0;background:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:6px 0;font-weight:500}
  .topnav .links button[aria-current="page"]{color:var(--ink);font-weight:700}
  .pad{padding-left:36px;padding-right:36px}
}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14.5px;background:var(--green);color:var(--on-green);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.small{padding:7px 13px;font-size:13px}
.btn.danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12.5px;background:var(--sand);color:var(--sand-ink);font-weight:500;white-space:nowrap}
.chip.demo{background:var(--peach);color:var(--peach-ink)}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av.sm{width:26px;height:26px;font-size:10.5px}
.av.lg{width:46px;height:46px;font-size:16px}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.card{background:var(--surface);border-radius:22px;padding:20px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px}
.sec-h h2{font-size:18px;font-weight:600}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:22px;border-radius:18px;border:1.5px dashed var(--line);color:var(--ink-2);text-align:center}

/* ---------- hero (template 1 green band) ---------- */
.hero{position:relative;overflow:hidden;background:var(--espresso);color:var(--on-photo);border-radius:0 0 44px 0;padding-block:22px 30px;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:64% 30%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--shade-mid) 0%,var(--shade-0) 30%,var(--shade) 82%)}
.hero .band-in{position:relative;z-index:1;width:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.hero .hero-top{margin-bottom:auto;padding-bottom:24px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--rust);color:var(--on-photo)}
.tag.m{background:var(--mustard);color:var(--espresso)}.tag.d{background:var(--denim)}.tag.t{background:var(--teal)}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-in{position:relative}
.hello{font-weight:600;font-size:16px}
.hero h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
.hero-sub{margin-top:10px;opacity:.88;font-size:15px}
.search{margin-top:20px;display:flex;align-items:center;gap:10px;background:#fff;color:#22264A;border-radius:999px;padding:12px 18px;max-width:520px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:#22264A;font-size:14.5px}
.search input::placeholder{color:#7d8094}
@media (min-width:960px){
  .hero{border-radius:26px;margin:22px 36px 0;padding:40px;min-height:360px}
  .hero::after{background:linear-gradient(90deg,var(--shade) 0%,var(--shade-mid) 42%,var(--shade-0) 72%)}
  .hero>img{object-position:center 35%}
  .hero .band-in{padding:0}
  .hero-top{display:none}
  .hero h1{font-size:40px;max-width:16ch}
  .hero-sub{max-width:44ch}
}
.band-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* dashboard row (template 2) */
.dash{display:grid;gap:16px;margin-top:22px}
@media (min-width:720px){.dash{grid-template-columns:1.7fr 1fr}}
.cont{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:22px;display:flex;gap:20px;align-items:center;position:relative;overflow:hidden}
.cont .cover{width:92px;flex:none}
.cont .meta{min-width:0;flex:1}
.cont .label{color:rgba(255,255,255,.7)}
.cont h3{font-size:21px;font-weight:600;margin:6px 0 2px}
.cont .by{opacity:.75;font-size:14px}
.bigpct{font-size:44px;font-weight:500;line-height:1;margin-top:14px;letter-spacing:-.02em}
.bigpct small{font-size:16px;opacity:.7;margin-left:4px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:6px}
.cont .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.cont .btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.cont .bar i{background:var(--mustard)}
.goal{background:var(--peach);color:var(--peach-ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px}
.goal h3{font-size:16px;font-weight:600}
.goal .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.goal .big{font-size:52px;font-weight:600;line-height:1;color:var(--ink)}
.goal p{font-size:13.5px}
.goal .tip{background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px;margin-top:auto}
.goal .tip b{display:block}

/* photo moments */
.moments{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;margin-top:22px;padding-bottom:4px;scrollbar-width:none}
.moment{border:0;padding:0;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:5/4;max-width:100%;text-align:left;color:var(--on-photo);background:var(--espresso);display:block}
.moment img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.moment:hover img{transform:scale(1.05)}
.moment .mt{position:absolute;left:10px;right:10px;bottom:10px;padding:12px 14px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.moment .mt span{display:flex;flex-direction:column;min-width:0}
.moment .mt b{font-size:16.5px;font-weight:600}
.moment .mt small{font-size:12.5px;opacity:.88}
.moment .mt svg{width:22px;height:22px;flex:none}
.m-1 .mt{background:var(--mustard);color:var(--espresso)}.m-2 .mt{background:var(--rust)}.m-3 .mt{background:var(--denim)}
/* photo banners */
.pbanner{position:relative;overflow:hidden;border-radius:24px;min-height:220px;display:flex;align-items:flex-end;margin-top:16px;color:var(--on-photo);background:var(--espresso)}
.pbanner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--shade-0) 0%,var(--shade-mid) 35%,var(--shade) 78%)}
@media (max-width:959px){.pbanner{min-height:320px}}
.pb-in{position:relative;z-index:1;padding:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;width:100%}
.pb-in h1{font-size:28px;font-weight:600}
.pb-in p{opacity:.9;margin-top:6px;max-width:52ch}
.pb-in .acts{display:flex;gap:8px;flex-wrap:wrap}
.pb-in .btn.ghost{background:var(--on-photo);color:var(--espresso);box-shadow:none}
.pb-back{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.16);color:var(--on-photo);box-shadow:none;backdrop-filter:blur(6px)}
.pb-back:hover{background:rgba(255,255,255,.28)}
@media (min-width:960px){.pbanner{min-height:260px;margin-top:22px}.pb-in{padding:28px 30px}.pb-in h1{font-size:34px}}

/* chips filter */
.chips{display:flex;gap:6px;overflow-x:auto;margin:24px -4px 0;padding:2px 4px;scrollbar-width:none}
.chips button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--ink-2);font-weight:500;white-space:nowrap;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--sand);color:var(--sand-ink);font-weight:600}

/* cover grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 16px;margin-top:18px}
@media (min-width:960px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 22px}}
.tile{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .cover{width:100%}
.tile b{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile>span{font-size:12.5px;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .tbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 6px}
.tile .tbar i{display:block;height:100%;background:var(--green)}
.tile.add .cover{display:grid;place-items:center;border:2px dashed var(--line);background:none;color:var(--green);box-shadow:none}
.tile.add .cover svg{width:34px;height:34px}
.cover{container-type:inline-size;aspect-ratio:2/3;max-width:100%;border-radius:6px 10px 10px 6px;overflow:hidden;box-shadow:0 10px 22px rgba(20,20,40,.22), inset 4px 0 0 rgba(0,0,0,.12);position:relative;background:var(--cv1)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{color:#fff;text-align:left}
.cover .cin{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16cqw 12cqw 14cqw}
.cover.gen .ct{font-weight:600;font-size:clamp(8px,15cqw,28px);line-height:1.08;overflow-wrap:break-word;hyphens:auto;position:relative;z-index:1}
.cover.gen .ca{font-size:clamp(6px,7.5cqw,12px);position:relative;z-index:1;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.cover.gen::after{content:"";position:absolute;inset:auto -20% -30% auto;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.08)}
.cover.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--shade-0) 30%,var(--shade) 100%);z-index:1}
.cover.photo::after{display:none}
.cover .cin{z-index:2}
.cover.photo .cin{justify-content:flex-end;gap:4px}
.cover .fmt{position:absolute;right:6px;top:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.88);color:#22264A;border-radius:4px;padding:2px 5px;z-index:1}

/* lower dashboard */
.dash2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:30px;margin-bottom:30px}
@media (min-width:860px){.dash2{grid-template-columns:1fr 1.3fr}}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .who{flex:1;min-width:0}
.mrow .who b{display:block;font-weight:600;font-size:14.5px}
.mrow .who span{font-size:12.5px;color:var(--ink-2)}
.pctbadge{font-weight:600;font-size:13.5px;border-radius:10px;padding:6px 9px;background:var(--green-soft);color:var(--green-2)}
:root[data-theme="dark"] .pctbadge{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pctbadge{color:var(--ink)}}

/* ---------- notes ---------- */
.note{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.note header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note header b{font-weight:600;font-size:14px}
.note header time{font-size:12px;color:var(--ink-2);margin-left:auto}
.vis{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.vis.group{background:var(--green-soft);color:var(--ink);box-shadow:none}
.vis.me{background:var(--sand);color:var(--sand-ink);box-shadow:none}
.quote{font-family:var(--f-read);font-size:14.5px;line-height:1.5;padding:2px 0 2px 12px;border-left:4px solid var(--hl-y);color:var(--ink)}
.quote.c-g{border-color:var(--hl-g)}.quote.c-b{border-color:var(--hl-b)}.quote.c-r{border-color:var(--hl-r)}
.note .txt{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .src{font-size:12.5px;color:var(--ink-2)}

const DB = (() => {
  const mem = new Map(); let p = null;
  function open(){ if (p) return p; p = new Promise(res => { try { const r = indexedDB.open('lisons-ensemble', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
  } catch(e){ res(null); } }); return p; }
  async function get(k){ if (mem.has(k)) return mem.get(k); const db = await open(); if (!db) return undefined;
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => { mem.set(k, q.result); res(q.result); }; q.onerror = () => res(undefined); } catch(e){ res(undefined); } }); }
  async function set(k, v){ mem.set(k, v); const db = await open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch(e){ res(); } }); }
  async function del(k){ mem.delete(k); const db = await open(); if (!db) return; try { db.transaction('kv','readwrite').objectStore('kv').delete(k); } catch(e){} }
  return {get, set, del};
})();

function canSee(n){
  if (n.authorId === 'me') return true;
  const g = groupOf(n.groupId); if (!g || !g.members.some(m => m.id === 'me')) return false;
  if (n.vis === 'group') return true;
  if (n.vis === 'chosen') return (n.viewers || []).includes('me');
  if (n.vis === 'leads') return isLead(g);
  return false;
}
function avatar(p, cls = ''){ const n = p.name || '?'; const ini = n.split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
  return `<span class="av ${cls}" style="background:${p.color || AVC[hash(n) % AVC.length]}" title="${esc(n)}" aria-hidden="true">${esc(ini)}</span>`; }
function coverHTML(b, extra = ''){
  const fmt = b.format === 'sample' ? '' : `<span class="fmt">${b.format === 'pdf' ? 'PDF' : 'EPUB'}</span>`;
  if (b.photo) return `<div class="cover gen photo ${extra}"><img src="${b.photo}" alt="" loading="lazy"><div class="cin"><span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author || '')}</span></div></div>`;
  if (b.cover) return `<div class="cover ${extra}">${fmt}<img src="${b.cover}" alt=""></div>`;
  return `<div class="cover gen ${extra}" style="background:var(--cv${(hash(b.title) % 6) + 1})">${fmt}<div class="cin"><span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author || '')}</span></div></div>`;
}

function bookTile(b){ const p = pct(b.id);
  return `<button class="tile" data-act="open-book" data-id="${b.id}">${coverHTML(b)}<b>${esc(b.title)}</b><span>${esc(b.author || '—')}</span>${p>0?`<div class="tbar"><i style="width:${Math.round(p*100)}%"></i></div>`:''}</button>`; }
function gridHTML(){
  const q = S.q.trim().toLowerCase();

  if (S.filter === 'reading') list = list.filter(b => pct(b.id) > 0 && pct(b.id) < .999);

/* ================= voices (Web Speech API) ================= */
const TTS = {
  ok: 'speechSynthesis' in window, voices: [], queue: [], qi: 0, playing: false, token: 0, timerMin: 0, timerEnd: 0,

const FEM = ['amelie','audrey','aurelie','marie','julie','hortense','denise','celine','lea','virginie','chantal','sylvie','eloise','vivienne','brigitte','charlotte','josephine','yvette','coralie','jacqueline','sophie','ariane','sarah','caroline','elsa','alice','manon','claire','female','femme','fra','frc'];
const MAS = ['thomas','nicolas','daniel','paul','henri','claude','mathieu','remi','antoine','jacques','fabrice','guillaume','jean','alain','pierre','louis','gerard','yves','alexandre','maxime','remy','male','homme','frb','frd'];
function vgender(v){ const n = ' ' + v.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ') + ' ';
  if (FEM.some(w => n.includes(' ' + w + ' '))) return 'f'; if (MAS.some(w => n.includes(' ' + w + ' '))) return 'm';
  if (n.includes(' google ')) return 'f'; return '?'; }
function vscore(v){ const n = v.name.toLowerCase(); let s = 0; if (/natural|neural|enhanced|premium|online|network|amélior|ameliore/.test(n)) s += 3; if (/google/.test(n)) s += 1; if ((v.lang||'').toLowerCase().replace('_','-') === 'fr-fr') s += 2; if (v.localService === false) s += 1; return s; }
function frVoices(){ const fr = TTS.voices.filter(v => (v.lang || '').toLowerCase().startsWith('fr')); return fr.length ? fr : TTS.voices; }
function loadVoices(){ if (!TTS.ok) return; TTS.voices = speechSynthesis.getVoices() || []; if (S.view.name === 'profile') fillVoiceSelects(); }
function pickVoice(g){
  const pref = g === 'f' ? S.profile.voiceF : S.profile.voiceM; const list = frVoices();
  const chosen = pref && list.find(v => v.voiceURI === pref); if (chosen) return {v:chosen, pitch:1};
  const match = list.filter(v => vgender(v) === g).sort((a,b) => vscore(b) - vscore(a))[0]; if (match) return {v:match, pitch:1};
  const any = list.slice().sort((a,b) => vscore(b) - vscore(a))[0];
  // No voice of that gender on this phone: shift the pitch of the best available one.
  const other = any ? vgender(any) : '?'; return {v:any || null, pitch: other === g ? 1 : (g === 'm' ? 0.78 : 1.18)};
}
function fillVoiceSelects(){
  const list = frVoices(); const P = S.profile;
  const opt = sel => `<option value="">Automatique</option>` + list.map(v => { const g = vgender(v); return `<option value="${esc(v.voiceURI)}" ${v.voiceURI===sel?'selected':''}>${esc(v.name)} · ${esc(v.lang)}${g==='f'?' · féminine':g==='m'?' · masculine':''}</option>`; }).join('');
  const f = $('#pf-vf'), m = $('#pf-vm'); if (!f) return; f.innerHTML = opt(P.voiceF); m.innerHTML = opt(P.voiceM);
  const nf = list.filter(v => vgender(v)==='f').length, nm = list.filter(v => vgender(v)==='m').length;
  $('#voice-hint').textContent = !TTS.ok ? "Ce navigateur ne propose pas la synthèse vocale." : !list.length ? 'Aucune voix détectée pour le moment.' :
    `${list.length} voix française${list.length>1?'s':''} sur cet appareil (${nf} féminine${nf>1?'s':''}, ${nm} masculine${nm>1?'s':''} reconnue${nm>1?'s':''}). Si une voix est mal classée, choisissez-la ici.`;
}
function speakTest(g){ if (!TTS.ok) return toast("La synthèse vocale n'est pas disponible ici"); stopTTS(); const {v, pitch} = pickVoice(g);
  const u = new SpeechSynthesisUtterance(g === 'f' ? "Bonjour, je suis la voix féminine de votre lecteur." : "Bonjour, je suis la voix masculine de votre lecteur.");
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'fr-FR'; u.rate = S.profile.rate; u.pitch = pitch; speechSynthesis.speak(u); }
const SAMPLE_SPEECH = "Le 16/10/2026 à 19h30, 25 jeunes ont lu Jean 3:16-18 ; 72 % ont aimé le 1er chapitre. Cotisation : 5 000 FCFA, soit 2,5 % du budget… Rendez-vous p. 12, chap. IV, sur le XXe siècle !";
function voiceSettingsHTML(){ const P = S.profile;
  return `<div class="field"><span>Longueur des pauses</span><div class="seg" role="group">${[[0.6,'Courtes'],[1,'Normales'],[1.5,'Longues']].map(([k,l]) => `<button data-act="pscale" data-v="${k}" aria-pressed="${P.pauseScale===k}">${l}</button>`).join('')}</div>
      <small>Pause après chaque point, point-virgule, deux-points, points de suspension et fin de paragraphe.</small></div>
    <div class="field"><span>Virgules</span><div class="seg" role="group"><button data-act="pcomma" data-v="natural" aria-pressed="${P.commas==='natural'}">Respiration naturelle</button><button data-act="pcomma" data-v="marked" aria-pressed="${P.commas==='marked'}">Pause marquée</button></div>
      <small>« Pause marquée » ajoute un court silence à chaque virgule si votre voix les enchaîne trop vite.</small></div>

function speakSample(){ if (!TTS.ok) return toast("La synthèse vocale n'est pas disponible ici"); stopTTS();
  const src = ($('#pf-sample')?.value || SAMPLE_SPEECH); const parts = chunksOfText(src, S.profile.commas === 'marked'); let i = 0; const my = ++TTS.token;
  const step = () => { if (my !== TTS.token || i >= parts.length) return; const c = parts[i++]; const u = makeUtterance(speechText(src.slice(c.s, c.e)));
    u.onend = () => { TTS.gapT = setTimeout(step, Math.round(Math.max(c.pause, i === parts.length ? 0 : 0) * (S.profile.pauseScale || 1) / Math.max(.6, S.profile.rate))); }; speechSynthesis.speak(u); };
  step(); }

/* ================= reader ================= */
const R = {book:null, content:null, ch:0, mode:'text', pdf:null, sel:null, notesOpen:false, speak:null};
const contentCache = new Map();
async function getContent(id){ if (contentCache.has(id)) return contentCache.get(id); let c = await DB.get('content:' + id);
  if (!c) { try { toast('Téléchargement du livre…'); c = await fetchContent(id); DB.set('content:' + id, c); } catch(e){ c = null; } }
  if (c) contentCache.set(id, c); return c; }
async function openReader(id, o = {}){
  const b = bookOf(id); if (!b) return; const c = await getContent(id);
  if (!c) return toast("Impossible d'ouvrir ce livre : vérifiez votre connexion Internet puis réessayez.");
  R.book = b; R.content = c; R.pdf = null; R.notesOpen = !!o.notes;
  const pr = S.progress[id] || {ch:0, pos:0};
  R.ch = Math.min(o.ch ?? pr.ch ?? 0, c.chapters.length - 1);

  const rd = $('#reader'); rd.hidden = false; rd.dataset.rt = S.profile.rt === 'auto' ? '' : S.profile.rt;
  document.body.style.overflow = 'hidden';
  $('#r-book').textContent = b.title; $('#r-modebtn').hidden = b.format !== 'pdf';
  updateGenderBtns(); $('#tts-rate').textContent = S.profile.rate + '×';
  await renderChapter(o.para != null ? null : (o.ch == null ? pr.pos : 0));

  if (o.listen) startTTS();

function closeReader(){ stopTTS(); hideSel(); $('#reader').hidden = true; document.body.style.overflow = ''; saveProgress(true); render(); }
function chapterTitle(i){ const ch = R.content.chapters[i]; return ch?.title || (R.book.format === 'pdf' ? `Page ${i+1}` : `Chapitre ${i+1}`); }
async function renderChapter(pos){
  const chs = R.content.chapters, ch = chs[R.ch];
  $('#r-chap').textContent = `${chapterTitle(R.ch)} · ${R.ch + 1}/${chs.length}`;
  const t = $('#r-text'); t.className = 'r-text' + (S.profile.rf === 'sans' ? ' sans' : ''); t.style.setProperty('--rs', S.profile.rs + 'px');
  const info = $('#r-info');
  if (R.content.scanned) { info.hidden = false; info.innerHTML = '<p>Ce PDF semble scanné (images sans texte). La lecture vocale et le surlignage ne sont pas possibles sur ce fichier. Vous pouvez ajouter des notes sur la page.</p>'; }
  else info.hidden = true;
  if (R.mode === 'page') { t.hidden = true; $('#r-pages').hidden = false; await renderPdfPage(); }
  else { $('#r-pages').hidden = true; t.hidden = false;
    t.innerHTML = `<h2 class="r-ch">${esc(chapterTitle(R.ch))}</h2>` + (ch.blocks.length ? ch.blocks.map((bk, i) => bk.t === 'h' ? `<h3 data-p="${i}">${esc(bk.x)}</h3>` : `<p data-p="${i}">${paraInner(i)}</p>`).join('') : '<p class="muted">Cette page ne contient pas de texte.</p>'); }
  $('#r-modebtn').setAttribute('aria-pressed', R.mode === 'page');

function paraInner(i){
  const bk = R.content.chapters[R.ch].blocks[i]; const text = bk.x; const L = text.length;
  const ranges = S.notes.filter(n => n.bookId === R.book.id && n.ch === R.ch && n.para === i && n.start >= 0 && canSee(n))
    .map(n => ({s:Math.max(0,n.start), e:Math.min(L,n.end), n}));
  const sp = R.speak && R.speak.ch === R.ch && R.speak.p === i ? R.speak : null;
  const pts = new Set([0, L]); ranges.forEach(r => { pts.add(r.s); pts.add(r.e); }); if (sp) { pts.add(sp.s); pts.add(sp.e); }
  const arr = [...pts].filter(x => x >= 0 && x <= L).sort((a,b) => a-b); let out = '';
  for (let k = 0; k < arr.length - 1; k++) { const a = arr[k], z = arr[k+1]; if (a === z) continue;

function refreshPara(i){ const el = $(`#r-text [data-p="${i}"]`); if (el && el.tagName === 'P') el.innerHTML = paraInner(i); }

  const sc = $('#r-scroll'); const pos = sc.scrollHeight > sc.clientHeight ? sc.scrollTop / (sc.scrollHeight - sc.clientHeight) : 1;

  $('#r-bar').style.width = (p * 100).toFixed(1) + '%'; $('#r-pct').textContent = Math.round(p * 100) + ' %';
  S.progress[R.book.id] = {ch:R.ch, pos, pct: Math.max(p, R.ch === n - 1 && pos > .97 ? 1 : p), at:Date.now()};
}
let progT; function saveProgress(now){ clearTimeout(progT); if (R.book) API.progress(R.book.id); if (now) save(); else progT = setTimeout(save, 800); }
async function gotoChapter(i, keepAudio){ if (!R.content || i < 0 || i >= R.content.chapters.length) return; if (!keepAudio) stopTTS(); hideSel(); R.ch = i; await renderChapter(0); updateProg(); saveProgress(); renderNotesPanel(); }

/* PDF page mode */
async function getPdf(){ if (R.pdf) return R.pdf; if (!window.pdfjsLib) throw new Error('pdf.js');
  if (!R.content.file) { R.content.file = await fetchPdfFile(R.book.id); DB.set('content:' + R.book.id, R.content); } pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  R.pdf = await pdfjsLib.getDocument({data: new Uint8Array(R.content.file.slice(0))}).promise; return R.pdf; }
async function renderPdfPage(){
  const box = $('#r-pages'); box.innerHTML = '<p class="muted" style="text-align:center">Chargement de la page…</p>';
  try { const pdf = await getPdf(); const page = await pdf.getPage(R.ch + 1); const w = Math.min(box.clientWidth - 24, 900);
    const vp0 = page.getViewport({scale:1}); const scale = w / vp0.width; const dpr = Math.min(2, window.devicePixelRatio || 1); const vp = page.getViewport({scale: scale * dpr});

/* selection → highlight / note */
function selInfo(){
  const s = window.getSelection(); if (!s || s.isCollapsed || !s.rangeCount) return null;
  const r = s.getRangeAt(0); const t = $('#r-text'); if (!t.contains(r.commonAncestorContainer)) return null;
  const startEl = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest('[data-p]'); if (!startEl || startEl.tagName !== 'P') return null;
  const para = +startEl.dataset.p; const text = R.content.chapters[R.ch].blocks[para].x;
  const pre = document.createRange(); pre.setStart(startEl, 0); pre.setEnd(r.startContainer, r.startOffset); let start = pre.toString().length;
  let end; if (startEl.contains(r.endContainer)) { const pe = document.createRange(); pe.setStart(startEl, 0); pe.setEnd(r.endContainer, r.endOffset); end = pe.toString().length; } else end = text.length;
  while (start < end && /\s/.test(text[start])) start++; while (end > start && /\s/.test(text[end-1])) end--;
  if (end - start < 1) return null;

async function parsePdf(file, onProg){

async function importFiles(files){

    case 'rt': S.profile.rt = el.dataset.v; $$('[data-act="rt"]').forEach(b => b.setAttribute('aria-pressed', b === el)); $('#reader').dataset.rt = S.profile.rt === 'auto' ? '' : S.profile.rt; save(); break;
    case 'page-note': noteSheet(newNote({}), true); break;
    case 'sel-hl': { const s = R.sel; if (!s) break; const n = newNote({para:s.para, start:s.start, end:s.end, quote:s.quote, color:el.dataset.c, vis:'me'}); S.notes.push(n); save(); API.saveNote(n, true).catch(e => fail(e)); window.getSelection().removeAllRanges(); hideSel(); refreshPara(s.para); renderNotesPanel(); toast('Passage surligné (visible par vous seul)'); break; }
    case 'sel-note': { const s = R.sel; if (!s) break; const n = newNote({para:s.para, start:s.start, end:s.end, quote:s.quote}); window.getSelection().removeAllRanges(); hideSel(); noteSheet(n, true); break; }
    case 'sel-listen': { const s = R.sel; if (!s) break; window.getSelection().removeAllRanges(); hideSel(); TTS.queue = sentencesOf(R.ch); const i = TTS.queue.findIndex(x => x.p === s.para && x.e > s.start); startTTS(i < 0 ? 0 : i); break; }
    case 'tts-play': if (TTS.playing) pauseTTS(); else startTTS(R.speak ? TTS.qi : undefined); break;
    case 'tts-back': if (TTS.queue.length) { TTS.qi = Math.max(0, TTS.qi - 1); if (TTS.playing) speakCurrent(); else setSpeak(TTS.queue[TTS.qi]); } break;
    case 'tts-fwd': if (TTS.queue.length) { TTS.qi = Math.min(TTS.queue.length, TTS.qi + 1); if (TTS.playing) speakCurrent(); else if (TTS.queue[TTS.qi]) setSpeak(TTS.queue[TTS.qi]); } break;
    case 'tts-g': S.profile.voiceGender = el.dataset.g; save(); updateGenderBtns(); if (TTS.playing) speakCurrent(); break;
    case 'tts-rate': { const steps = [0.75, 1, 1.25, 1.5, 1.75, 2]; const i = steps.indexOf(S.profile.rate); S.profile.rate = steps[(i + 1) % steps.length]; el.textContent = S.profile.rate + '×'; save(); if (TTS.playing) speakCurrent(); break; }
    case 'tts-timer': { const steps = [0, 15, 30, 60]; TTS.timerMin = steps[(steps.indexOf(TTS.timerMin) + 1) % steps.length]; TTS.timerEnd = TTS.timerMin ? Date.now() + TTS.timerMin * 60000 : 0; el.textContent = TTS.timerMin ? `⏱ ${TTS.timerMin} min` : '⏱ Off'; el.classList.toggle('on', !!TTS.timerMin); break; }
  }
});
document.addEventListener('submit', e => { const f = e.target.closest('.replyform'); if (!f) return; e.preventDefault(); const inp = f.querySelector('input'); const t = inp.value.trim(); if (!t) return;
  const n = S.notes.find(x => x.id === f.dataset.id); n.replies = n.replies || []; n.replies.push({authorId:'me', text:t, at:Date.now()}); save(); API.reply(n.id, t).catch(e => fail(e, "La réponse n'a pas pu être envoyée.")); afterNoteChange(n); toast('Réponse envoyée'); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; $('#grid').innerHTML = gridHTML(); return; }
  const a = t.dataset.actInput; if (!a) return;
  if (a === 'pname') { S.profile.name = t.value; save(); renderNav(); if (t.value.trim()) API.profileName(); }
  if (a === 'rate') { S.profile.rate = +t.value; $('#rate-v').textContent = S.profile.rate + '×'; save(); }
  if (a === 'sample') { $('#pf-spoken').textContent = speechText(t.value); }
  if (a === 'cal') { const g = groupOf(t.dataset.id); g.calendar = t.value; save(); API.calendar(g); }
});
document.addEventListener('change', e => {
  const t = e.target; if (t.id === 'file-input') { const files = Array.from(t.files || []); t.value = ''; if (files.length) importFiles(files); return; }
  const a = t.dataset.actChange; if (!a) return;
  if (a === 'vf') { S.profile.voiceF = t.value; save(); } if (a === 'vm') { S.profile.voiceM = t.value; save(); }
  if (a === 'gbook') { groupOf(t.dataset.id).bookId = t.value; save(); render(); API.groupBook(t.dataset.id, t.value).catch(e => fail(e)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#sheet-root').innerHTML) closeSheet(); else if (!$('#r-sel').hidden) hideSel(); } });
$('#r-scroll').addEventListener('scroll', () => { if (!R.content) return; updateProg(); saveProgress(); if (!$('#r-sel').hidden) hideSel(); }, {passive:true});
document.addEventListener('dragover', e => { if ($('#reader').hidden) e.preventDefault(); });
document.addEventListener('drop', e => { if (!$('#reader').hidden) return; e.preventDefault(); const files = Array.from(e.dataTransfer?.files || []); if (files.length) importFiles(files); });

/* ================= boot ================= */
$('#auth-form').addEventListener('submit', submitAuth);
(async function boot(){
  if (TTS.ok) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch(e){ speechSynthesis.onvoiceschanged = loadVoices; } }
  updatePlayBtn();
  try { const p = JSON.parse(localStorage.getItem('le-prefs') || 'null'); if (p) S.profile = {...S.profile, ...p}; } catch(e){}
  const code = new URLSearchParams(location.search).get('code'); if (code) { try { sessionStorage.setItem('le-code', code.trim().toUpperCase()); } catch(e){} }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  if (!sb) { showAuth("Le service n'a pas pu se charger. Vérifiez votre connexion Internet puis rechargez la page."); return; }
  sb.auth.onAuthStateChange((ev, session) => { if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) startApp(session); if (ev === 'SIGNED_OUT' && ME) { ME = null; showAuth(); } });
  const {data} = await sb.auth.getSession(); if (data.session) startApp(data.session); else showAuth();
})();
</script>
