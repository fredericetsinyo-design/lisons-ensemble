<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essai des voix</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#1f2a37;--mute:#6b7280;--acc:#2f7d5b}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#eee;--mute:#9a9a9a;--acc:#5fc493}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;padding:24px 16px}
main{max-width:720px;margin:auto}h1{font-size:1.6rem;margin:0 0 4px}p{color:var(--mute);margin:0 0 20px}
.c{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.c h2{font-size:1.05rem;margin:0 0 2px}.c small{color:var(--mute);display:block;margin-bottom:10px}
.row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}audio{width:100%}
.tag{font-size:.8rem;color:var(--acc);font-weight:600}.none{color:var(--mute);font-style:italic}
</style></head><body><main>
<h1>Quelle voix pour Lisons Ensemble ?</h1>
<p>Les mêmes textes (Jean 3:16-17 et un extrait de roman) lus par des voix libres et gratuites. Écoutez et dites laquelle vous préférez.</p>
<div id="list"></div></main>
<script>
const V=[
 ["chatterbox","A · Chatterbox Multilingual","La plus humaine, mais lourde : à pré-générer (idéal pour la Bible)."],
 ["kokoro","B · Kokoro (voix Siwis)","Très naturelle et légère, voix féminine."],
 ["piper-siwis","C · Piper Siwis","Légère, peut tourner sur le téléphone, hors ligne."],
 ["piper-tom","D · Piper Tom","Voix masculine légère, hors ligne."],
 ["piper-upmc","E · Piper UPMC","Voix légère, hors ligne."]];
const L=document.getElementById('list');
for(const [id,t,d] of V){const c=document.createElement('div');c.className='c';
c.innerHTML=`<h2>${t}</h2><small>${d}</small>`+['bible','livre'].map(k=>`<div class="row"><span class="tag">${k=='bible'?'Bible':'Livre'}</span><audio controls preload="none" src="audio/${id}-${k}.mp3" onerror="this.outerHTML='<span class=none>pas encore prêt</span>'"></audio></div>`).join('');L.appendChild(c)}
</script></body></html>
