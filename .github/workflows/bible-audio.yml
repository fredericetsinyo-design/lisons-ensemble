name: Bible audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['outils/bible-audio/run.json']
permissions:
  contents: write
concurrency: { group: bible-audio, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: python3 outils/bible-audio/plan.py
      - name: Créer les publications (releases)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for t in f-at f-nt h-at h-nt; do
            gh release view bible-audio-$t >/dev/null 2>&1 || gh release create bible-audio-$t --title "Bible audio ($t)" --notes "Audio de la Bible Louis Segond 1910 (domaine public) pour Lisons Ensemble. f = voix féminine (Kokoro, Apache-2.0), h = voix masculine (Piper Tom, MIT). at = Ancien Testament, nt = Nouveau Testament." --latest=false
          done
  voix:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
      - name: Installer la voix
        run: |
          pip install -q soundfile numpy
          if [ "${{ matrix.voice }}" = f ]; then
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q "kokoro>=0.9.4" "misaki[fr]"
          else
            pip install -q "piper-tts==1.3.0"
            mkdir -p voices && for e in onnx onnx.json; do curl -sSL -o voices/fr_FR-tom-medium.$e "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium/fr_FR-tom-medium.$e"; done
          fi
      - name: Générer
        run: python outils/bible-audio/gen.py ${{ matrix.voice }} "${{ matrix.chapters }}" out
      - name: Publier les MP3
        if: needs.plan.outputs.release == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd out
          at=$(ls *.mp3 | awk -F- '$1<=39'); nt=$(ls *.mp3 | awk -F- '$1>=40')
          for i in 1 2 3; do
            ok=1
            [ -n "$at" ] && { gh release upload bible-audio-${{ matrix.voice }}-at $at --clobber || ok=0; }
            [ -n "$nt" ] && { gh release upload bible-audio-${{ matrix.voice }}-nt $nt --clobber || ok=0; }
            [ $ok = 1 ] && break; sleep 20
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bible-${{ matrix.voice }}-${{ matrix.shard }}
          path: |
            out/*.json
            out/*.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.release != 'true'
        with: { name: 'mp3-${{ matrix.voice }}-${{ matrix.shard }}', path: out/*.mp3, retention-days: 3 }
  minutage:
    needs: voix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: 'bible-*' }
      - run: |
          python3 outils/bible-audio/merge.py
          cat dl/*/stats-*.txt > outils/bible-audio/stats.txt || true
          tail -5 outils/bible-audio/stats.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add bible/audio outils/bible-audio/stats.txt
          git commit -m "Bible audio : minutage des versets" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done || echo "rien à publier"
